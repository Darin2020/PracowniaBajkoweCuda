# Local development dependencies. Copy `.env.example` to `.env` first.
#   docker compose up -d                        SQL Server, Azurite, Mailpit
#   docker compose --profile app up -d --build  the same + the application image on http://localhost:8080
name: bajkowecuda

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env (see .env.example)}
    ports:
      - "127.0.0.1:${SQL_PORT:-1433}:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --location /data --loose
    ports:
      - "127.0.0.1:${AZURITE_BLOB_PORT:-10000}:10000"
      - "127.0.0.1:${AZURITE_QUEUE_PORT:-10001}:10001"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 && nc -z 127.0.0.1 10001"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    restart: unless-stopped

  # The application image (API + prerendered Angular site). Only started with `--profile app`.
  app:
    profiles: ["app"]
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-local}
        PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    image: bajkowecuda-app:local
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Not read by the API yet; wired now so later phases only add code (docs/PLAN.md §14).
      ConnectionStrings__Sql: Server=sqlserver,1433;Database=BajkoweCuda;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Email__Provider: Smtp
      Email__Smtp__Host: mailpit
      Email__Smtp__Port: "1025"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      azurite:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    # Hardening that mirrors production: read-only root file system, no extra privileges.
    # (No healthcheck here: the chiseled image has no shell or curl. Use /health/live from outside.)
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  sqlserver-data:
  azurite-data:
