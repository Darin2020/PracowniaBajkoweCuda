<div class="carousel" role="region" aria-roledescription="carousel" [attr.aria-label]="label()">
  <div
    #track
    class="track"
    tabindex="0"
    (scroll)="onScroll()"
    (keydown.arrowLeft)="previous(); $event.preventDefault()"
    (keydown.arrowRight)="next(); $event.preventDefault()"
  >
    @for (item of items(); track item.src; let position = $index) {
      <div
        class="slide"
        role="group"
        aria-roledescription="slide"
        [attr.aria-label]="slideLabel(position)"
      >
        <button
          type="button"
          class="slide__button"
          [attr.aria-label]="openLabel(item.alt)"
          (click)="opened.emit(position)"
        >
          <img
            class="slide__image"
            [ngSrc]="item.src"
            [width]="item.width"
            [height]="item.height"
            [alt]="item.alt"
          />
        </button>
      </div>
    }
  </div>

  <div class="controls">
    <button
      type="button"
      class="arrow"
      [attr.aria-label]="previousLabel"
      [disabled]="atStart()"
      (click)="previous()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24">
        <path d="M15 5l-7 7 7 7" />
      </svg>
    </button>

    <ul class="dots">
      @for (item of items(); track item.src; let position = $index) {
        <li>
          <button
            type="button"
            class="dot"
            [class.dot--current]="position === index()"
            [attr.aria-label]="goToLabel(position)"
            [attr.aria-current]="position === index() ? 'true' : null"
            (click)="goTo(position)"
          ></button>
        </li>
      }
    </ul>

    <button
      type="button"
      class="arrow"
      [attr.aria-label]="nextLabel"
      [disabled]="atEnd()"
      (click)="next()"
    >
      <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24">
        <path d="M9 5l7 7-7 7" />
      </svg>
    </button>
  </div>
</div>
