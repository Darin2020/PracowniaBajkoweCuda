version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      azure:
        patterns: ["Azure.*"]
      testing:
        patterns: ["xunit*", "Shouldly", "NSubstitute", "Testcontainers*", "Respawn"]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*", "angular-eslint", "typescript"]
      lint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier"]
      testing:
        patterns: ["vitest", "jsdom"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
