version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      azure:
        patterns: ["Azure.*"]
      testing:
        patterns: ["xunit*", "Shouldly", "NSubstitute", "Testcontainers*", "Respawn"]
      # The managed library only accepts a native libSkiaSharp of its own version: bump them together.
      skiasharp:
        patterns: ["SkiaSharp*"]
    ignore:
      # Packages released with ASP.NET Core / EF Core / Serilog follow the target framework's major (.NET 10 LTS).
      # Their next major targets .NET 11 and drags Microsoft.Extensions.* 11 into the app; it comes with the
      # framework upgrade. Patch and minor updates still arrive.
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Serilog.AspNetCore"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*", "angular-eslint", "typescript"]
      lint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier"]
      testing:
        patterns: ["vitest", "jsdom"]
    ignore:
      # Angular pins the TypeScript range (e.g. @angular/build 22 needs >=6.0 <6.1), so a newer
      # major or minor breaks `npm ci`. TypeScript is raised together with the Angular upgrade.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # The SignalR client is released with ASP.NET Core; its major follows the server's (.NET 10 LTS).
      - dependency-name: "@microsoft/signalr"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # The project is pinned to .NET 10 LTS (global.json, TargetFramework). A newer major of the SDK or
      # runtime image cannot build it, so it is raised by hand together with the target framework.
      - dependency-name: dotnet/sdk
        update-types: ["version-update:semver-major"]
      - dependency-name: dotnet/aspnet
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
