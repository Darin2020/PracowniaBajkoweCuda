version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      azure:
        patterns: ["Azure.*"]
      testing:
        patterns: ["xunit*", "Shouldly", "NSubstitute", "Testcontainers*", "Respawn"]

  - package-ecosystem: npm
    directory: /src/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "@schematics/*", "angular-eslint", "typescript"]
      lint:
        patterns: ["eslint*", "@eslint/*", "typescript-eslint", "prettier"]
      testing:
        patterns: ["vitest", "jsdom"]
    ignore:
      # Angular pins the TypeScript range (e.g. @angular/build 22 needs >=6.0 <6.1), so a newer
      # major or minor breaks `npm ci`. TypeScript is raised together with the Angular upgrade.
      - dependency-name: typescript
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
