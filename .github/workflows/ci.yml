name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  backend:
    name: Backend (build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BajkoweCuda.sln

      - name: Build (warnings are errors)
        run: dotnet build BajkoweCuda.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --solution BajkoweCuda.sln --configuration Release --no-build
          --results-directory TestResults
          --report-trx
          --coverage --coverage-output-format cobertura

      - name: Vulnerable packages
        run: |
          dotnet list BajkoweCuda.sln package --vulnerable --include-transitive | tee vulnerable.txt
          ! grep -q "has the following vulnerable packages" vulnerable.txt

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit
        # High and critical advisories fail the build unless accepted, with a review date, in audit-allowlist.json.
        run: npm run audit

  image:
    name: Docker image (build + Trivy + smoke test + Lighthouse)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tests run in the backend and frontend jobs, so the image build skips them (RUN_TESTS=false).
      - name: Build image (no push)
        env:
          APP_VERSION: ${{ github.sha }}
        run: >
          docker build
          --build-arg "APP_VERSION=$APP_VERSION"
          --tag bajkowecuda:ci .

      - name: Trivy (fail on HIGH/CRITICAL with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: bajkowecuda:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      # Same restrictions as production: read-only root file system, no capabilities.
      - name: Start container
        run: |
          docker run --detach --name app --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges --env PublicBaseUrl=http://localhost:8080 --publish 8080:8080 bajkowecuda:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail --output /dev/null http://localhost:8080/health/live; then exit 0; fi
            sleep 1
          done
          echo "The container did not become healthy."; docker logs app; exit 1

      - name: Smoke test
        run: bash scripts/smoke-test.sh http://localhost:8080

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      # Mobile Lighthouse >= 90 in all four categories, and no console errors (CSP violations are console errors).
      - name: Lighthouse CI
        run: npx --yes @lhci/cli@0.16.1 autorun

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Container logs
        if: ${{ failure() }}
        run: docker logs app || true

  compose:
    name: Compose file is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: docker compose config
        env:
          MSSQL_SA_PASSWORD: not-a-real-password
        run: docker compose --profile app config --quiet
